name: CI

# Static analysis and unit tests on every pull request and every push to main.
# Codemagic builds and publishes; this is the gate that keeps a broken main from
# being picked up by it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in step with codemagic.yaml (the version releases are built with).
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Packages
        run: flutter pub get

      # Infos (style hints) are reported but don't fail the build; warnings and errors do.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test
